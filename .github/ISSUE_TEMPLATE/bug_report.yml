name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us reproduce and fix it.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the platform is affected?
      options:
        - Backend (Spring Boot API)
        - Frontend (React + Vite)
        - Lab Digital (Sandbox/Tickets)
        - Hoja de Vida (CV)
        - Asistencia
        - Académico/Notas
        - Bienestar
        - Familiar
        - Portafolio Público (Lovecraft)
        - Mascotas / CopilotWidget
        - Data Analysis (Python)
        - Deployment / Render
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/Commit
      description: Git commit hash or branch where bug occurs
      placeholder: "e.g., main / 8bd9ec8"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of the bug
      placeholder: "What happened?"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
      placeholder: "Describe the expected behavior"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? (Include error messages, stack traces, screenshots)
      placeholder: "Paste error logs, stack traces, or describe what you see"
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser / Environment
      options:
        - Chrome (latest)
        - Firefox (latest)
        - Safari
        - Edge
        - Mobile Chrome
        - Mobile Safari
        - Backend only (Postman/curl)
        - Other
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Traces
      description: Paste relevant logs, console output, or stack traces
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to avoid duplicates
          required: true
        - label: I have tested on the latest main branch
          required: false
        - label: I have provided all relevant information
          required: true