name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please describe your idea below.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the platform would this affect?
      options:
        - Backend (Spring Boot API)
        - Frontend (React + Vite)
        - Lab Digital (Sandbox/Tickets)
        - Hoja de Vida (CV)
        - Asistencia
        - Académico/Notas
        - Bienestar
        - Familiar
        - Portafolio Público (Lovecraft)
        - Mascotas / CopilotWidget
        - Data Analysis (Python)
        - Deployment / Render
        - Design System / UI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What's the pain point?
      placeholder: "Currently, users cannot... / It would be helpful if..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution
      placeholder: "I'd like to see... / The feature should..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?
      placeholder: "I also thought about... but..."
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low (nice to have)
        - Medium (should have)
        - High (must have)
        - Critical (blocker)
    validations:
      required: false
  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Links to mockups, sketches, or reference implementations
      placeholder: "Figma link, screenshot, similar feature in other apps..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues/PRs to avoid duplicates
          required: true
        - label: This feature aligns with the project roadmap
          required: false
        - label: I'm willing to contribute to implementation
          required: false