name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # BACKEND - Spring Boot (Java 17 + Maven)
  # ============================================================
  backend-test:
    name: Backend - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Validate Maven wrapper
        run: mvn validate

      - name: Run tests
        run: mvn test

      - name: Build package (skip tests)
        run: mvn -DskipTests package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ============================================================
  # FRONTEND - React + Vite (Node 20)
  # ============================================================
  frontend-test:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run typecheck
        run: npm run typecheck --if-present

      - name: Run tests
        run: npm test --if-present -- --watchAll=false

      - name: Build production
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================
  # DATA ANALYSIS - Python (Pandas, NumPy, SciPy)
  # ============================================================
  data-analysis-test:
    name: Data Analysis - Validate Scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./data-analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: data-analysis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || pip install pandas numpy scipy matplotlib seaborn

      - name: Validate Python scripts
        run: python -m py_compile scripts/*.py run_all_analysis.py

      - name: Run analysis (dry-run)
        run: python run_all_analysis.py --dry-run 2>&1 | head -50 || true

  # ============================================================
  # SECURITY - Dependency scanning
  # ============================================================
  security-scan:
    name: Security - Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================
  # DEPLOY - Render (on main branch only)
  # ============================================================
  deploy-render:
    name: Deploy to Render
    needs: [backend-test, frontend-test, data-analysis-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy (Backend)
        if: env.RENDER_BACKEND_DEPLOY_HOOK != ''
        run: curl -X POST ${{ env.RENDER_BACKEND_DEPLOY_HOOK }}

      - name: Trigger Render Deploy (Frontend)
        if: env.RENDER_FRONTEND_DEPLOY_HOOK != ''
        run: curl -X POST ${{ env.RENDER_FRONTEND_DEPLOY_HOOK }}

      - name: Notify deployment
        run: |
          echo "✅ Deployment triggered for main branch"
          echo "Backend: https://educore-backend.onrender.com"
          echo "Frontend: https://educore-frontend.onrender.com"

  # ============================================================
  # NOTIFICATIONS
  # ============================================================
  notify:
    name: Notify Status
    needs: [backend-test, frontend-test, data-analysis-test, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.backend-test.result }}" == "success" && \
                "${{ needs.frontend-test.result }}" == "success" && \
                "${{ needs.data-analysis-test.result }}" == "success" && \
                "${{ needs.security-scan.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Post status to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ steps.status.outputs.status }}';
            const emoji = status === 'success' ? '✅' : '❌';
            const title = status === 'success' ? 'All checks passed' : 'Some checks failed';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${emoji} **${title}**\n\n| Job | Status |\n|-----|--------|\n| Backend | ${{ needs.backend-test.result }} |\n| Frontend | ${{ needs.frontend-test.result }} |\n| Data Analysis | ${{ needs.data-analysis-test.result }} |\n| Security Scan | ${{ needs.security-scan.result }} |\n\n*Triggered by @${{ github.actor }}*`
            })