server.port=${PORT:8080}
spring.application.name=plataforma-estudiantil-portal

# H2 File Database (persistent, offline-ready)
# AUTO_SERVER permite abrir la BD desde herramientas externas (DBeaver, SQL Shell)
# mientras la app esta corriendo. No combinar con DB_CLOSE_ON_EXIT=FALSE.
spring.datasource.url=jdbc:h2:file:./data/edudb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola Web H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Manejo de formatos JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=America/Bogota

# Uploads locales (offline-ready)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB